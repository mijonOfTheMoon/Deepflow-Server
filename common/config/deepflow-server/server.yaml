log-file: /var/log/deepflow/server.log
log-level: info
controller:
  election-name: deepflow-server
  election-namespace: deepflow
  grpc-max-message-length: 104857600
  grpc-port: 20035
  kubeconfig:
  listen-port: 20417
  clickhouse:
    database: flow_tag
    host: clickhouse
    port: 9000
    user-name: default
    user-password:
  mysql:
    database: deepflow
    host: mysql
    port: 30130
    timeout: 30
    user-name: root
    user-password: deepflow
  trisolaris:
    trident-type-for-unkonw-vtap: 3
    chrony:
      host: ntp.cloud.aliyuncs.com
      port: 123
      timeout: 1
ingester:
  es-syslog: false
  ckdb:
    cluster-name:
    external: false
    host: clickhouse
    port: 9000
    storage-policy:
  ckdb-auth:
    password:
    username: default
  flow-metrics-ttl-hour:
    vtap-flow-1m: 168           # network metrics 1-min granularity  = 7 days
    vtap-flow-1s: 24            # network metrics 1-sec granularity  = 1 day
    vtap-app-1m: 168            # application metrics 1-min          = 7 days
    vtap-app-1s: 24             # application metrics 1-sec          = 1 day
  flow-log-ttl-hour:
    l4-flow-log: 72             # L4 flow logs                       = 3 days
    l7-flow-log: 72             # L7 call logs (HTTP/gRPC/MySQL...)  = 3 days
    l4-packet: 72               # L4 packet data                     = 3 days
  event-ttl-hour: 168           # resource/k8s events                = 7 days
  alert-event-ttl-hour: 168     # alert events                       = 7 days
  file-event-ttl-hour: 168      # file I/O events                    = 7 days
  profile-ttl-hour: 72          # continuous profiling               = 3 days
  pcap-ttl-hour: 72             # packet capture                     = 3 days
  ext-metrics-ttl-hour: 168     # ext metrics                        = 7 days
  prometheus-ttl-hour: 168      # prometheus metrics                 = 7 days
  application-log-ttl-hour: 168 # application logs                   = 7 days
querier:
  listen-port: 20416
  clickhouse:
    database: flow_tag
    host: clickhouse
    port: 9000
    timeout: 60
    user-name: default
    user-password:
  deepflow-app:
    host: deepflow-app
    port: 20418