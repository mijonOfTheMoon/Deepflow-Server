daemon:
  port: 20831

api_timeout: 500
sql_show: False
log_file: /var/log/df-llm-agent.log
log_level: info
instance_path: /root/df-llm-agent

mysql:
    user_name: root
    user_password: deepflow
    host: deepflow-mysql
    port: 30130
    database: deepflow_llm

ai:
  enable: False
  platforms:

    - platform: "openai"
      enable: True
      model: "openai"
      api_key: "sk-xxx"
      engine_name:
        - ''

    - platform: 'azure'
      enable: False
      model: 'gpt'
      api_type: 'azure'
      api_key: ''
      api_base: ''
      api_version: ''
      engine_name:
        - ''

    - platform: 'aliyun'
      enable: False
      model: 'dashscope'
      api_key: ''
      engine_name:
        - 'qwen-max'
        - 'qwen-plus-latest'

    - platform: 'baidu'
      enable: False
      model: 'qianfan'
      api_key: ''
      api_secret: ''
      engine_name:
        - 'ERNIE-Bot'
        - 'ERNIE-Bot-turbo'

    - platform: 'zhipu'
      enable: False
      model: 'zhipuai'
      api_key: ''
      engine_name:
        - 'chatglm_turbo'