daemon:
  port: 20831

api_timeout: 500
sql_show: False
log_file: /var/log/df-llm-agent.log
log_level: info
instance_path: /root/df-llm-agent

mysql:
    user_name: root
    user_password: deepflow
    host: deepflow-mysql
    port: 30130
    database: deepflow_llm

ai:
  enable: False
  platforms:
    - platform: 'openai'
      enable: False
      model: 'openai'
      api_key: ''
      api_base: 'https://api.openai.com/v1'
      engine_name:
        - 'gpt-4'
        - 'gpt-3.5-turbo'

    - platform: 'azure'
      enable: False
      model: 'gpt'
      api_type: 'azure'
      api_key: ''
      api_base: ''
      api_version: ''
      engine_name:
        - ''

    - platform: 'aliyun'
      enable: False
      model: 'dashscope'
      api_key: ''
      engine_name:
        - 'qwen-max'
        - 'qwen-plus-latest'

    - platform: 'baidu'
      enable: False
      model: 'qianfan'
      api_key: ''
      api_secret: ''
      engine_name:
        - 'ERNIE-Bot'
        - 'ERNIE-Bot-turbo'

    - platform: 'zhipu'
      enable: False
      model: 'zhipuai'
      api_key: 'xxx'
      engine_name:
        - 'chatglm_turbo'

deepflow_server_url: 'http://deepflow-server:20416'